name: tanstack-start-cf-template

services:
  resendev:
    image: jupitercl/resendev:latest
    container_name: resend_dev
    restart: unless-stopped
    ports:
      - "3099:3099"
    volumes:
      - resendev_data:/app/data
    networks:
      - tanstack-start-cf-template-network

networks:
  tanstack-start-cf-template-network:
    driver: bridge

volumes:
  resendev_data:
    driver: local
